name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (defaults to herosms/Cargo.toml)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.asset_suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_suffix: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: aarch64-unknown-linux-gnu
            musl: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: aarch64-apple-darwin
            musl: false
          - runner: macos-13-large
            target: x86_64-apple-darwin
            asset_suffix: x86_64-apple-darwin
            musl: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${DISPATCH_VERSION}" ]]; then
            ver="${DISPATCH_VERSION}"
          else
            ver=$(grep '^version' herosms/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: cargo build
        run: cargo build -p herosms --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          ver="${{ steps.version.outputs.version }}"
          name="herosms-${ver}-${{ matrix.asset_suffix }}"
          bin="target/${{ matrix.target }}/release/herosms"
          if command -v strip >/dev/null 2>&1; then
            strip "$bin" || true
          fi
          install -m 755 "$bin" "$name"
          sha256sum "$name" | tee "${name}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: herosms-${{ matrix.asset_suffix }}
          path: |
            herosms-${{ steps.version.outputs.version }}-${{ matrix.asset_suffix }}
            herosms-${{ steps.version.outputs.version }}-${{ matrix.asset_suffix }}.sha256
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version and tag
        id: meta
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${DISPATCH_VERSION}" ]]; then
            ver="${DISPATCH_VERSION}"
            tag="v${ver}"
          else
            ver=$(grep '^version' herosms/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            tag="v${ver}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          for f in dist/herosms-"${ver}"-*; do
            [[ "${f}" == *.sha256 ]] && continue
            cp "${f}" release-assets/
          done
          (cd release-assets && sha256sum herosms-* > SHA256SUMS)
          cat release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: herosms ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
