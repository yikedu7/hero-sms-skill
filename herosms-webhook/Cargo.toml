[package]
name = "herosms-webhook"
version = "0.1.0"
edition = "2021"
description = "Sample HeroSMS incoming SMS webhook receiver"
license = "MIT"

[[bin]]
name = "herosms-webhook"
path = "src/main.rs"

[dependencies]
herosms = { path = "../herosms" }
clap = { version = "=4.4.18", features = ["derive", "env"] }
serde_json = "1.0"
tiny_http = "0.12"

[dev-dependencies]
ureq = { version = "=2.9.6", default-features = false, features = ["tls"] }
