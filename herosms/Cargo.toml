[package]
name = "herosms"
version = "0.1.0"
edition = "2021"
description = "OpenAPI-driven HeroSMS API CLI"
license = "MIT"

[[bin]]
name = "herosms"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", default-features = true, features = ["derive", "env"] }
ureq = { version = "=2.9.6", default-features = false, features = ["tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
percent-encoding = "2.3"

[dev-dependencies]
serde_json = "1.0"
